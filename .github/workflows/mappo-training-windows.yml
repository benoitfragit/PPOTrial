name: Progressive Blue Defense (Windows Release)

on:
  workflow_dispatch:
    inputs:
      max_team_size:
        description: "Maximum team size: 2, 3 or 4 (2v2 legacy by default)"
        required: true
        type: choice
        default: "2"
        options:
          - "2"
          - "3"
          - "4"
      scenario_variant:
        description: "Objective layout and zones: 4 combinations, all gates/replays"
        required: true
        type: choice
        default: fixed_no_zones
        options:
          - fixed_no_zones
          - fixed_zones
          - randomized_no_zones
          - randomized_zones
      max_seconds:
        description: "Training time budget in seconds (leave headroom for build/artifacts)"
        required: true
        type: number
        default: 14400
      save_every_updates:
        description: "Save actor and complete training state every N PPO updates"
        required: true
        type: number
        default: 1
      resume_run_id:
        description: "Previous workflow run ID for optimizer and gate continuation"
        required: false
        type: string
        default: ""
      progressive_gate:
        description: "Gate to train (limited by max_team_size)"
        required: true
        type: choice
        default: "1v0"
        options:
          - 1v0
          - 2v0
          - 1v1
          - 2v1
          - 2v2
          - 3v0
          - 3v1
          - 3v2
          - 3v3
          - 4v0
          - 4v1
          - 4v2
          - 4v3
          - 4v4
      rehearsal_profile:
        description: "Rehearsal profile (3vX/4vX require balanced_v1; 2v2 legacy unchanged)"
        required: false
        type: choice
        default: legacy
        options:
          - legacy
          - balanced_v1
          - patrol_focus_v1
          - combat_focus_v1
      success_percent:
        description: "Minimum evaluated gate mission success percent [0,100]"
        required: true
        type: number
        default: 92
      same_threshold_all_gates:
        description: "Apply success_percent to EVERY gate (unchecked: use each gate's configured threshold)"
        required: true
        type: boolean
        default: true
      auto_advance:
        description: "Launch the next independent GitHub run after gate PASS"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: mappo-progressive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: windows-2022
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact training sources
        uses: actions/checkout@v4

      - name: Restore previous training checkpoint (optional)
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: blue-mappo-checkpoints
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: Examples/BlueDefense/projects/BluePatrol/checkpoints

      - name: Adopt the former Blue checkpoint names of the restored run (optional)
        if: ${{ inputs.resume_run_id != '' }}
        run: |
          # Earlier runs saved blue_patrol_generalized_v10.txt / _training_v7.txt; the
          # loaders read that format by content, under the PPOKit artifact names.
          python tools/ci/blue_checkpoint.py adopt Examples/BlueDefense/projects/BluePatrol/checkpoints
          if ($LASTEXITCODE -ne 0) { throw "Cannot adopt the restored Blue checkpoints" }

      - name: Verify existing RLMission production model
        run: |
          $red = "Examples/Airspace/models/RLMission/prod/policy.txt"
          if (-not (Test-Path -LiteralPath $red -PathType Leaf)) {
            throw "The unchanged red production RLMission model is missing: $red"
          }

      - name: Restore Release runtime cache (ppokit-run and the BlueDefense DLLs)
        id: runtime_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/release/PPOKit/Release
            build/release/Examples/BlueDefense/Release
            build/release/ppokit_programs_Release.txt
          key: ppokit-blue-runtime-${{ runner.os }}-x64-msvc2022-Release-${{ github.sha }}

      - name: Validate runtime cache
        id: runtime_probe
        run: |
          $usable = "${{ steps.runtime_cache.outputs.cache-hit }}" -eq "true"
          foreach ($file in @("build/release/PPOKit/Release/ppokit-run.exe",
                              "build/release/Examples/BlueDefense/Release/blue_environment.dll",
                              "build/release/Examples/BlueDefense/Release/blue_network.dll",
                              "build/release/Examples/BlueDefense/Release/blue_visualiser.dll",
                              "build/release/ppokit_programs_Release.txt")) {
            if (-not (Test-Path $file -PathType Leaf)) { $usable = $false }
          }
          "usable=$($usable.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Configure MSVC 2022 x64 Release
        if: steps.runtime_probe.outputs.usable != 'true'
        run: |
          # ppokit-run and the BlueDefense DLLs only: the ECS world without graphics.
          cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DPPO_BUILD_DESKTOP=OFF `
            -DPPO_BUILD_WORLD=ON `
            -DPPO_BUILD_CORE_TESTS=OFF `
            -DPPO_BUILD_CHECKPOINT_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Compile ppokit-run and the BlueDefense DLLs (Release)
        if: steps.runtime_probe.outputs.usable != 'true'
        run: |
          cmake --build build/release --config Release --parallel 2 `
            --target ppokit-run blue_environment blue_network blue_visualiser
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }

      - name: Verify Blue Defense runtime and dependencies
        run: |
          # One episode of the committed production actor: both DLLs load and the world steps.
          $smoke = Join-Path $env:RUNNER_TEMP "runtime-smoke"
          New-Item -ItemType Directory -Path $smoke -Force | Out-Null
          $actor = Join-Path $smoke "policy.ppokit"
          # The committed bytes (a pipe in PowerShell would rewrite the line endings).
          cmd /c "git show HEAD:Examples/BlueDefense/projects/BluePatrol/checkpoints/prod/policy.ppokit > `"$actor`""
          if ($LASTEXITCODE -ne 0) { throw "Cannot extract the committed production actor" }
          & build/release/PPOKit/Release/ppokit-run.exe play --episodes 1 `
            --project Examples/BlueDefense/projects/BluePatrol/project.legacy.json --policy $actor
          if ($LASTEXITCODE -ne 0) { throw "ppokit-run runtime validation failed" }

      - name: Cache validated Release binaries
        if: steps.runtime_probe.outputs.usable != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/release/PPOKit/Release
            build/release/Examples/BlueDefense/Release
            build/release/ppokit_programs_Release.txt
          key: ppokit-blue-runtime-${{ runner.os }}-x64-msvc2022-Release-${{ github.sha }}

      - name: Validate MAPPO telemetry report logic
        run: |
          python -m unittest discover -s tools/ci -p "test_mappo_metrics.py" -v
          if ($LASTEXITCODE -ne 0) { throw "MAPPO telemetry tests failed" }

      - name: Validate MAPPO curriculum configuration and orchestrator
        run: |
          python -m unittest discover -s tools/ci -p "test_mappo_curriculum.py" -v
          if ($LASTEXITCODE -ne 0) { throw "MAPPO curriculum tests failed" }
          python -m unittest discover -s tools/ci -p "test_blue_checkpoint.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Blue checkpoint tests failed" }
          python -m unittest discover -s tools/ci/adaptive_curriculum -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "MAPPO progressive gate tests failed" }

      - name: Configure independent frequent checkpoints
        env:
          SAVE_EVERY_UPDATES: ${{ inputs.save_every_updates }}
        run: |
          $value = 0L
          if (-not [long]::TryParse($env:SAVE_EVERY_UPDATES, [ref]$value) -or $value -lt 1) {
            throw "save_every_updates must be a positive integer"
          }
          $path = "Examples/BlueDefense/projects/BluePatrol/blue_patrol_training.json"
          $config = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          $config.training | Add-Member -MemberType NoteProperty -Name saveEveryUpdates -Value $value -Force
          # Keep the standalone Blue Defense workflow unchanged.
          $config.evaluation | Add-Member -MemberType NoteProperty -Name episodes -Value 20 -Force
          $config.evaluation | Add-Member -MemberType NoteProperty -Name seed -Value 1004242 -Force
          $config | ConvertTo-Json -Depth 40 | Set-Content -LiteralPath $path -Encoding utf8
          Write-Host "Checkpoint every $value update(s); progressive evaluation uses 20 independent seeds."
          # Each run reports its own telemetry: the journal lines of the resumed runs are skipped.
          $journal = "Examples/BlueDefense/projects/BluePatrol/checkpoints/latest/metrics.jsonl"
          $lines = 0
          if (Test-Path -LiteralPath $journal -PathType Leaf) {
            $lines = @(Get-Content -LiteralPath $journal).Count
          }
          Set-Content -LiteralPath ".mappo-journal-start" -Value $lines -Encoding ascii
          # Must be newer than any restored checkpoint to reject no-op training.
          New-Item -Path ".mappo-training-start" -ItemType File -Force | Out-Null
          (Get-Item ".mappo-training-start").LastWriteTimeUtc = [DateTime]::UtcNow

      - name: Train one progressive MAPPO gate (time- and success-bounded)
        env:
          GATE: ${{ inputs.progressive_gate }}
          MAX_TEAM_SIZE: ${{ inputs.max_team_size }}
          SCENARIO_VARIANT: ${{ inputs.scenario_variant }}
          SUCCESS_PERCENT: ${{ inputs.success_percent }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          AUTO_ADVANCE: ${{ inputs.auto_advance }}
          SAME_THRESHOLD_ALL_GATES: ${{ inputs.same_threshold_all_gates }}
          REHEARSAL_PROFILE: ${{ inputs.rehearsal_profile }}
        run: |
          # Legacy dispatches did not provide max_team_size; keep 2v2 default.
          $teamSize = $env:MAX_TEAM_SIZE
          if ([string]::IsNullOrWhiteSpace($teamSize)) { $teamSize = "2" }
          $pythonArgs = @(
            "-u", "tools/ci/adaptive_curriculum/progressive_gate.py",
            "--gate", $env:GATE,
            "--max-team-size", $teamSize,
            "--threshold-percent", $env:SUCCESS_PERCENT,
            "--max-seconds", $env:MAX_SECONDS,
            "--block-updates", "20"
          )
          # Older manual/scripted callers have no scenario_variant input.
          $scenarioVariant = $env:SCENARIO_VARIANT
          if ([string]::IsNullOrWhiteSpace($scenarioVariant)) {
            $scenarioVariant = "fixed_no_zones"
          }
          switch ($scenarioVariant) {
            "fixed_no_zones" {}
            "fixed_zones" { $pythonArgs += "--hostile-zones" }
            "randomized_no_zones" {
              $pythonArgs += @("--objective-layout", "randomized")
            }
            "randomized_zones" {
              $pythonArgs += @("--objective-layout", "randomized", "--hostile-zones")
            }
            default { throw "Unknown scenario variant" }
          }
          if (-not [string]::IsNullOrWhiteSpace($env:REHEARSAL_PROFILE) -and
              $env:REHEARSAL_PROFILE -ne "legacy") {
            $pythonArgs += @("--rehearsal-profile", $env:REHEARSAL_PROFILE)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:RESUME_RUN_ID)) {
            $pythonArgs += "--resume"
          }
          if ($env:AUTO_ADVANCE -eq "true") {
            $pythonArgs += "--auto-advance"
          }
          if ($env:SAME_THRESHOLD_ALL_GATES -eq "false") {
            $pythonArgs += "--per-gate-thresholds"
          }
          & python @pythonArgs
          if ($LASTEXITCODE -ne 0) { throw "Progressive gate training failed" }

      - name: Validate resumable checkpoint
        env:
          SCENARIO: progressive-blue-defense
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          $root = "Examples/BlueDefense/projects/BluePatrol/checkpoints/latest"
          $training = Join-Path $root "latest.ppokit"
          $actor = Join-Path $root "policy.ppokit"
          $start = (Get-Item ".mappo-training-start").LastWriteTimeUtc
          $progressive = $env:SCENARIO -eq "progressive-blue-defense"
          $resume = $progressive -and (-not [string]::IsNullOrWhiteSpace($env:RESUME_RUN_ID))
          foreach ($path in @($training, $actor)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Checkpoint missing: $path"
            }
            $file = Get-Item -LiteralPath $path
            if ($file.Length -le 0) {
              throw "Empty Blue checkpoint: $path"
            }
            if ($file.LastWriteTimeUtc -le $start) {
              if (-not $resume) {
                throw "No new checkpoint during this run: $path"
              }
              Write-Warning "Gate unfinished without a fresh PPO update; preserving prior valid checkpoint: $path"
            }
            Write-Host "$path : $($file.Length) bytes"
          }
          # Contract of either format: observation 10, network sizes, capacities,
          # unified guidance semantics and P/N range.
          python tools/ci/blue_checkpoint.py check --kind training $training
          if ($LASTEXITCODE -ne 0) {
            throw "Unexpected full-training checkpoint format"
          }
          if ($progressive) {
            python tools/ci/blue_checkpoint.py check --kind policy $actor
            if ($LASTEXITCODE -ne 0) {
              throw "Progressive checkpoint is not a unified-guidance actor with full optimizer"
            }
            $progressPath = "Examples/BlueDefense/projects/BluePatrol/checkpoints/adaptive-curriculum-progress.json"
            if (-not (Test-Path $progressPath -PathType Leaf)) {
              throw "Progressive checkpoint is missing its gate state"
            }
          }

      - name: Publish Blue MAPPO checkpoints (including after training failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-mappo-checkpoints
          path: |
            Examples/BlueDefense/projects/BluePatrol/checkpoints/latest/policy.ppokit
            Examples/BlueDefense/projects/BluePatrol/checkpoints/latest/latest.ppokit
            Examples/BlueDefense/projects/BluePatrol/checkpoints/latest/metrics.jsonl
            Examples/BlueDefense/projects/BluePatrol/checkpoints/prod/policy.ppokit
            Examples/BlueDefense/projects/BluePatrol/checkpoints/prod/policy.ppokit.score
            Examples/BlueDefense/projects/BluePatrol/checkpoints/best/**
            Examples/BlueDefense/projects/BluePatrol/checkpoints/curriculum-progress.json
            Examples/BlueDefense/projects/BluePatrol/checkpoints/adaptive-curriculum-progress.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish progressive gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-mappo-gate
          path: build/mappo-telemetry/adaptive-gate-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize MAPPO telemetry and render progress charts
        if: always()
        env:
          MAPPO_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONIOENCODING: utf-8
          CURRICULUM: 'false'
        run: |
          $log = "build/mappo-telemetry/mappo-training.log"
          if ($env:CURRICULUM -eq "true") {
            # Cross-level scores are NOT comparable; report only the current level.
            $stageLogs = @(Get-ChildItem "build/mappo-telemetry/curriculum" -Filter "training.log" -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName)
            if ($stageLogs.Count -gt 0) { $log = $stageLogs[-1].FullName }
            $curriculumSummary = "build/mappo-telemetry/curriculum-summary.md"
            if (Test-Path $curriculumSummary) {
              Get-Content $curriculumSummary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
          if (Test-Path "tools/ci/mappo_metrics.py") {
            $from = 0
            if (Test-Path ".mappo-journal-start") { $from = [int](Get-Content ".mappo-journal-start" -TotalCount 1) }
            python tools/ci/mappo_metrics.py `
              --journal Examples/BlueDefense/projects/BluePatrol/checkpoints/latest/metrics.jsonl `
              --journal-from-line $from `
              --log $log `
              --out build/mappo-telemetry `
              --summary $env:GITHUB_STEP_SUMMARY
            if ($LASTEXITCODE -ne 0) { Write-Warning "MAPPO telemetry report generation failed" }
          } else {
            Write-Warning "MAPPO telemetry script unavailable (checkout failed?)"
          }

      - name: Record reproducible diagnostic manifest
        if: always()
        env:
          SCENARIO: progressive-blue-defense
          CURRICULUM_ENABLED: 'false'
          CURRICULUM_VERSION: v3
          CURRICULUM_WARM_START: 'false'
          MAX_SECONDS: ${{ inputs.max_seconds }}
          SAVE_EVERY_UPDATES: ${{ inputs.save_every_updates }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          New-Item -ItemType Directory -Path "build/mappo-telemetry" -Force | Out-Null
          $hashes = [ordered]@{}
          foreach ($path in @(
            "Examples/BlueDefense/projects/BluePatrol/blue_patrol_training.json",
            "Examples/BlueDefense/projects/BluePatrol/eval/validation.json",
            "Examples/BlueDefense/curricula/BluePatrolCurriculumV3.json",
            "Examples/BlueDefense/projects/BluePatrol/scenario.json"
          )) {
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $hashes[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $manifest = [ordered]@{
            schema_version = 1
            repository = "${{ github.repository }}"
            run_id = [long]"${{ github.run_id }}"
            run_number = [long]"${{ github.run_number }}"
            run_attempt = [long]"${{ github.run_attempt }}"
            head_sha = "${{ github.sha }}"
            ref = "${{ github.ref }}"
            generated_utc = [DateTime]::UtcNow.ToString("o")
            inputs = [ordered]@{
              scenario = $env:SCENARIO
              curriculum_enabled = ($env:CURRICULUM_ENABLED -eq "true")
              curriculum_version = $env:CURRICULUM_VERSION
              curriculum_warm_start = ($env:CURRICULUM_WARM_START -eq "true")
              max_seconds = [long]$env:MAX_SECONDS
              save_every_updates = [long]$env:SAVE_EVERY_UPDATES
              resume_run_id = $env:RESUME_RUN_ID
            }
            configuration_sha256 = $hashes
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content `
            -LiteralPath "build/mappo-telemetry/run-manifest.json" -Encoding utf8

      - name: Publish MAPPO telemetry journal and SVG curves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-mappo-telemetry
          path: |
            Examples/BlueDefense/projects/BluePatrol/checkpoints/latest/metrics.jsonl
            build/mappo-telemetry/mappo-summary.md
            build/mappo-telemetry/mappo-progress.svg
            build/mappo-telemetry/mappo-losses.csv
            build/mappo-telemetry/mappo-optimizer.csv
            build/mappo-telemetry/mappo-training.log
            build/mappo-telemetry/run-manifest.json
            build/mappo-telemetry/curriculum-summary.md
            build/mappo-telemetry/curriculum/**
            build/mappo-telemetry/adaptive-gate-result.json
            build/mappo-telemetry/adaptive-gates/**
          if-no-files-found: warn
          retention-days: 30

  advance:
    name: Dispatch next progressive gate (no build)
    needs: train
    if: ${{ needs.train.result == 'success' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the evaluated gate result
        uses: actions/download-artifact@v4
        with:
          name: blue-mappo-gate
          path: build/mappo-telemetry
      - name: Retrieve checkpoint state and optimizer
        uses: actions/download-artifact@v4
        with:
          name: blue-mappo-checkpoints
          path: build/mappo-checkpoint
      - name: Validate gate and dispatch next independent workflow run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ci/adaptive_curriculum/dispatch_next_gate.py
