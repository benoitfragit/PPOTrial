name: Restart Progressive Blue Defense (checkpoint)

on:
  pull_request:
    paths:
      - .github/workflows/mappo-restart-progressive.yml
  workflow_run:
    workflows: ["Progressive Blue Defense (Windows Release)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed progressive run containing full V7 optimizer checkpoint"
        required: true
        type: string
        default: "41768154448"
      start_gate:
        description: "First gate of the NEW cycle (previous gate progress is reset)"
        required: true
        type: choice
        default: "1v0"
        options:
          - 1v0
          - 2v0
          - 3v0
          - 4v0
          - 1v1
          - 2v1
          - 3v1
          - 4v1
          - 1v2
          - 2v2
          - 3v2
          - 4v2
          - 1v3
          - 2v3
          - 3v3
          - 4v3
          - 4v4
      success_percent:
        description: "Evaluated mission-success threshold (first gate, or ALL gates when switch is on)"
        required: true
        type: number
        default: 85
      same_threshold_all_gates:
        description: "Use same success threshold for all gates (not only the first)"
        required: true
        type: boolean
        default: true
      max_seconds:
        description: "Training time budget for the first gate, in seconds"
        required: true
        type: number
        default: 14400
      auto_advance:
        description: "After a passing gate, dispatch the next existing progressive run"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: mappo-restart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_workflow:
    name: Lint GitHub Actions YAML and embedded scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify workflow with actionlint
        shell: bash
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color .github/workflows/mappo-restart-progressive.yml

  bootstrap:
    # A rerun must not overwrite the original bootstrap artifact.
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    name: Create a fresh curriculum cycle from a verified training checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current training contract
        uses: actions/checkout@v4

      - name: Validate source run provenance and completion
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'source_run_id must be a positive GitHub run ID' >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            | jq -e --arg repo "$GITHUB_REPOSITORY" '
                .status == "completed"
                and .conclusion == "success"
                and .repository.full_name == $repo
                and (.path | startswith(".github/workflows/mappo-training-windows.yml"))
              ' >/dev/null || { echo 'Source run must be a successful progressive training run in this repository' >&2; exit 1; }

      - name: Clear only transient workspace Blue checkpoints
        shell: bash
        run: |
          rm -rf resources/model/BluePatrol/latest resources/model/BluePatrol/prod
          rm -f resources/model/BluePatrol/adaptive-curriculum-progress.json

      - name: Restore source actor, critic, Adam and RNG
        uses: actions/download-artifact@v4
        with:
          name: blue-mappo-checkpoints
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: resources/model/BluePatrol

      - name: Verify full checkpoint and reset only curriculum progression
        env:
          START_GATE: ${{ inputs.start_gate }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SUCCESS_PERCENT: ${{ inputs.success_percent }}
          SAME_THRESHOLD: ${{ inputs.same_threshold_all_gates }}
          AUTO_ADVANCE: ${{ inputs.auto_advance }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from tools.ci.adaptive_curriculum.progressive_gate import validate_gates
          from tools.ci import mappo_curriculum

          root = Path('resources/model/BluePatrol')
          actor = root / 'latest/blue_patrol_generalized_v10.txt'
          training = root / 'latest/blue_patrol_generalized_training_v7.txt'
          progress_path = root / 'adaptive-curriculum-progress.json'
          for path in (actor, training, progress_path):
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f'Missing or empty source artifact: {path}')

          actor_header = actor.open(encoding='utf-8').readline().strip()
          training_header = training.open(encoding='utf-8').readline().strip()
          semantic = 'UNIFIED_PHYSICAL_GUIDANCE_V1'
          if (not actor_header.startswith('BLUE_TEAM_MAPPO_V10 10 10 ')
                  or semantic not in actor_header.split()
                  or not training_header.startswith('BLUE_TEAM_TRAINING_V7 7 10 ')
                  or semantic not in training_header.split()):
              raise RuntimeError('Incompatible V10 actor or full V7 optimizer semantic contract')

          gates_bytes = Path('tools/ci/adaptive_curriculum/gates.json').read_bytes()
          stages = validate_gates(json.loads(gates_bytes))
          stage_names = [stage['id'] for stage in stages]
          start_gate = os.environ['START_GATE']
          if start_gate not in stage_names:
              raise RuntimeError('Unknown target gate')

          source = json.loads(progress_path.read_text(encoding='utf-8'))
          lf_bytes = gates_bytes.replace(b'\r\n', b'\n')
          valid_hashes = {
              hashlib.sha256(lf_bytes).hexdigest(),
              hashlib.sha256(lf_bytes.replace(b'\n', b'\r\n')).hexdigest(),
          }
          if (source.get('formatVersion') != 1
                  or source.get('gateConfigSha256') not in valid_hashes):
              raise RuntimeError('Source curriculum config differs from current contract; refusing migration')
          updates = mappo_curriculum.read_updates(training)
          saved_updates = source.get('lastCheckpointUpdates')
          if (type(saved_updates) is not int or updates < saved_updates or updates <= 0):
              raise RuntimeError('Source optimizer checkpoint/update counter is invalid')

          threshold = float(os.environ["SUCCESS_PERCENT"])
          if not 0 < threshold <= 100:
              raise RuntimeError("success_percent must be in (0, 100]")
          same_threshold = os.environ["SAME_THRESHOLD"].lower() == "true"
          auto_advance = os.environ["AUTO_ADVANCE"].lower() == "true"

          # Preserve original weights and optimizer bytes. Only the orchestrator
          # progression is changed; prior gates must be revalidated this cycle.
          fresh = dict(
              formatVersion=1,
              gateConfigSha256=source['gateConfigSha256'],
              gateIndex=stage_names.index(start_gate),
              gate=start_gate,
              passed=False,
              elapsedSeconds=0.0,
              bestSuccessPercent=0.0,
              lastSuccessPercent=None,
              blockIndex=0,
              lastCheckpointUpdates=updates,
              validatedGates=[],
              restartCycle=dict(
                  schemaVersion=1,
                  bootstrapRunId=int(os.environ["GITHUB_RUN_ID"]),
                  sourceRunId=int(os.environ["SOURCE_RUN_ID"]),
                  sameThresholdAllGates=same_threshold,
                  successPercent=threshold,
                  autoAdvance=auto_advance,
              ),
          )
          progress_path.write_text(json.dumps(fresh, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(
                  f'### New progressive Blue Defense cycle\n'
                  f'- Source run: {os.environ["SOURCE_RUN_ID"]}\n'
                  f'- Retained PPO updates: {updates}\n'
                  f'- New first gate: {start_gate}\n'
                  '- Actor, critic, Adam, and RNG: preserved unchanged\n'
                  '- Gate validation and rehearsal progression: reset for the new cycle\n'
                  f'- Same success threshold on every gate: {same_threshold}\n'
                  f'- Requested success threshold: {threshold:g}%\n'
                  '- No training, compilation, or production promotion in this bootstrap job\n'
              )
          print(f'[RESTART] Source run {os.environ["SOURCE_RUN_ID"]}; update={updates}; gate={start_gate}')
          PY

      - name: Publish bootstrapped checkpoint for the EXISTING training workflow
        uses: actions/upload-artifact@v4
        with:
          name: blue-mappo-checkpoints
          path: |
            resources/model/BluePatrol/latest/blue_patrol_generalized_v10.txt
            resources/model/BluePatrol/latest/blue_patrol_generalized_training_v7.txt
            resources/model/BluePatrol/prod/blue_patrol_generalized_v10.txt
            resources/model/BluePatrol/prod/blue_patrol_generalized_v10.txt.score
            resources/model/BluePatrol/adaptive-curriculum-progress.json
          if-no-files-found: error
          retention-days: 30

  start_training:
    name: Dispatch the existing progressive training workflow (cached Release runtime)
    needs: bootstrap
    # Never re-dispatch the same first gate on a manual workflow rerun.
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch first gate of new cycle
        env:
          GH_TOKEN: ${{ github.token }}
          START_GATE: ${{ inputs.start_gate }}
          SUCCESS_PERCENT: ${{ inputs.success_percent }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          AUTO_ADVANCE: ${{ inputs.auto_advance }}
          SAME_THRESHOLD: ${{ inputs.same_threshold_all_gates }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo 'Restart is permitted only from the repository default branch' >&2
            exit 1
          fi
          python - <<'PY'
          import math
          import os
          threshold = float(os.environ['SUCCESS_PERCENT'])
          seconds = float(os.environ['MAX_SECONDS'])
          if (not math.isfinite(threshold) or not 0 < threshold <= 100
                  or not math.isfinite(seconds) or not seconds.is_integer()
                  or not 1 <= seconds <= 18000):
              raise SystemExit('Invalid success_percent or max_seconds')
          PY
          # In fixed-threshold mode, the NEW workflow advances gates itself;
          # prevent the existing 75%-default dispatcher from running as well.
          TRAIN_AUTO_ADVANCE="$AUTO_ADVANCE"
          if [[ "$SAME_THRESHOLD" == "true" ]]; then
            TRAIN_AUTO_ADVANCE=false
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mappo-training-windows.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" \
            -f "inputs[resume_run_id]=${GITHUB_RUN_ID}" \
            -f "inputs[progressive_gate]=${START_GATE}" \
            -f "inputs[success_percent]=${SUCCESS_PERCENT}" \
            -f "inputs[max_seconds]=${MAX_SECONDS}" \
            -f 'inputs[save_every_updates]=1' \
            -f "inputs[auto_advance]=${TRAIN_AUTO_ADVANCE}"
          {
            echo '### Training dispatched'
            echo "The existing Progressive Blue Defense workflow was dispatched from bootstrap run ${GITHUB_RUN_ID}."
            echo "Gate: ${START_GATE}; threshold: ${SUCCESS_PERCENT}%; budget: ${MAX_SECONDS}s."
            echo "Same threshold for all gates: ${SAME_THRESHOLD}; automatic continuation requested: ${AUTO_ADVANCE}."
            echo 'The normal training workflow handles Release-cache validation, compile fallback, checkpoint updates, evaluation, and subsequent gate dispatch.'
            echo "[Open training runs](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/mappo-training-windows.yml)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Never dispatch twice from the same completed training run on reruns.
  continue_same_threshold:
    name: Continue restarted curriculum at the chosen success threshold
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'workflow_dispatch'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.run_attempt == 1
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout trusted gate configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Probe for checkpoints from this completed training run
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          matches=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${TRAIN_RUN_ID}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "blue-mappo-checkpoints" and .expired == false)] | length')
          if [[ "$matches" == "1" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No uniquely available Blue checkpoint artifact; not a managed continuation."
          fi

      - name: Read optional cycle metadata
        if: steps.artifacts.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: blue-mappo-checkpoints
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/restart-cycle/model

      - name: Check whether fixed-threshold continuation is enabled
        id: optin
        if: steps.artifacts.outputs.available == 'true'
        env:
          CYCLE_MODEL_DIR: ${{ runner.temp }}/restart-cycle/model
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state_file = Path(os.environ['CYCLE_MODEL_DIR']) / 'adaptive-curriculum-progress.json'
          if not state_file.is_file():
              print('No adaptive state in completed run; skip.')
          else:
              state = json.loads(state_file.read_text(encoding='utf-8'))
              cycle = state.get('restartCycle')
              if (isinstance(cycle, dict)
                      and cycle.get('schemaVersion') == 1
                      and cycle.get('sameThresholdAllGates') is True
                      and cycle.get('autoAdvance') is True):
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                      output.write('enabled=true\n')
                  print('Fixed success threshold is enabled for this cycle.')
              else:
                  print('This run is not an auto-advancing fixed-threshold cycle.')
          PY

      - name: Retrieve evaluated gate outcome
        if: steps.optin.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: blue-mappo-gate
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/restart-cycle/gate

      - name: Validate gate handoff and dispatch the next independent run
        if: steps.optin.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAIN_RUN_ID: ${{ github.event.workflow_run.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CYCLE_MODEL_DIR: ${{ runner.temp }}/restart-cycle/model
          CYCLE_GATE_DIR: ${{ runner.temp }}/restart-cycle/gate
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import math
          import os
          import urllib.request
          from pathlib import Path
          from tools.ci.adaptive_curriculum.progressive_gate import validate_gates

          def get_run(run_id):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}',
                  headers={
                      'Authorization': f'Bearer {os.environ["GITHUB_TOKEN"]}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          # Completed-run artifacts are untrusted input: keep them outside the
          # checked-out source tree before running privileged dispatch logic.
          model_root = Path(os.environ['CYCLE_MODEL_DIR'])
          state = json.loads((model_root / 'adaptive-curriculum-progress.json').read_text(encoding='utf-8'))
          cycle = state['restartCycle']
          result = json.loads((Path(os.environ['CYCLE_GATE_DIR']) / 'adaptive-gate-result.json').read_text(encoding='utf-8'))
          gates_bytes = Path('tools/ci/adaptive_curriculum/gates.json').read_bytes()
          stages = validate_gates(json.loads(gates_bytes))
          lf_bytes = gates_bytes.replace(b'\r\n', b'\n')
          fingerprints = {
              hashlib.sha256(lf_bytes).hexdigest(),
              hashlib.sha256(lf_bytes.replace(b'\n', b'\r\n')).hexdigest(),
          }
          if (state.get('gateConfigSha256') not in fingerprints
                  or result.get('gateConfigSha256') != state['gateConfigSha256']
                  or result.get('gate') != state.get('gate')
                  or result.get('passed') is not state.get('passed')
                  or result.get('autoAdvance') is not False):
              raise RuntimeError('Invalid fixed-threshold gate outcome or configuration provenance')

          threshold = cycle.get('successPercent')
          bootstrap_id = cycle.get('bootstrapRunId')
          if (type(threshold) not in (int, float)
                  or not math.isfinite(threshold) or not 0 < threshold <= 100
                  or type(bootstrap_id) is not int or bootstrap_id <= 0
                  or float(result.get('thresholdPercent', -1)) != threshold):
              raise RuntimeError('Inconsistent cycle success threshold or bootstrap metadata')

          bootstrap = get_run(bootstrap_id)
          if (bootstrap.get('status') != 'completed'
                  or bootstrap.get('conclusion') != 'success'
                  or bootstrap.get('event') != 'workflow_dispatch'
                  or bootstrap.get('repository', {}).get('full_name') != os.environ['GITHUB_REPOSITORY']
                  or bootstrap.get('head_branch') != os.environ['DEFAULT_BRANCH']
                  or not bootstrap.get('path', '').startswith(
                      '.github/workflows/mappo-restart-progressive.yml')):
              raise RuntimeError('Invalid restart-cycle bootstrap provenance')

          if not result['passed']:
              print('Gate not passed: checkpoint retained; retry this gate manually with the same threshold.')
              raise SystemExit(0)
          ids = [stage['id'] for stage in stages]
          current = result['gate']
          if current not in ids:
              raise RuntimeError('Unknown validated gate')
          index = ids.index(current)
          if state.get('gateIndex') != index:
              raise RuntimeError('Inconsistent gate index')
          if index + 1 >= len(stages):
              print('Final 4v4 gate passed: curriculum complete.')
              raise SystemExit(0)
          next_stage = stages[index + 1]
          if (result.get('nextGate') != next_stage['id']
                  or result.get('nextThresholdPercent') != next_stage['thresholdPercent']
                  or result.get('nextMaxSeconds') != next_stage['maxSeconds']):
              raise RuntimeError('Invalid next gate handoff')
          inputs = {
              'resume_run_id': os.environ['TRAIN_RUN_ID'],
              'progressive_gate': next_stage['id'],
              'success_percent': f'{threshold:g}',
              'max_seconds': str(next_stage['maxSeconds']),
              'save_every_updates': '1',
              # The existing advance job must stay off for this cycle;
              # this workflow alone carries the fixed threshold forward.
              'auto_advance': 'false',
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/workflows/mappo-training-windows.yml/dispatches',
              data=json.dumps({'ref': os.environ['DEFAULT_BRANCH'], 'inputs': inputs}).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f'Bearer {os.environ["GITHUB_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise RuntimeError(f'Unexpected gate dispatch response {response.status}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(
                  f'### Next progressive gate dispatched\n'
                  f'- Completed: {current}\n'
                  f'- Next: {next_stage["id"]}\n'
                  f'- Success threshold retained: {threshold:g}%\n'
                  f'- Checkpoint source run: {os.environ["TRAIN_RUN_ID"]}\n'
              )
          print(f'[RESTART] Dispatched {next_stage["id"]} at {threshold:g}% from run {os.environ["TRAIN_RUN_ID"]}')
          PY
