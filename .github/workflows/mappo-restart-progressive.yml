name: Restart Progressive Blue Defense (checkpoint)

on:
  pull_request:
    paths:
      - .github/workflows/mappo-restart-progressive.yml
  workflow_dispatch:
    inputs:
      max_team_size:
        description: "Maximum team size: 2, 3 or 4 (2v2 legacy by default)"
        required: true
        type: choice
        default: "2"
        options:
          - "2"
          - "3"
          - "4"
      scenario_variant:
        description: "Objective layout and zones: 4 combinations, all gates/replays"
        required: true
        type: choice
        default: fixed_no_zones
        options:
          - fixed_no_zones
          - fixed_zones
          - randomized_no_zones
          - randomized_zones
      source_run_id:
        description: "Completed progressive run containing full V7 optimizer checkpoint"
        required: true
        type: string
        default: "41865674608"
      start_gate:
        description: "First gate of the new cycle (limited by max_team_size)"
        required: true
        type: choice
        default: "2v2"
        options:
          - 1v0
          - 2v0
          - 1v1
          - 2v1
          - 2v2
          - 3v0
          - 3v1
          - 3v2
          - 3v3
          - 4v0
          - 4v1
          - 4v2
          - 4v3
          - 4v4
      retrain_selected_gate:
        description: "Train for the full budget after BEST passes, preserving the chosen gate-rehearsal profile"
        required: true
        type: boolean
        default: false
      rehearsal_profile:
        description: "Training replay profile for the new cycle (legacy = historical behavior)"
        required: false
        type: choice
        default: legacy
        options:
          - legacy
          - balanced_v1
          - patrol_focus_v1
          - combat_focus_v1
      success_percent:
        description: "Evaluated mission-success threshold (first gate, or ALL gates when switch is on)"
        required: true
        type: number
        default: 92
      same_threshold_all_gates:
        description: "Use same success threshold for all gates (not only the first)"
        required: true
        type: boolean
        default: true
      max_seconds:
        description: "Training time budget for the first gate, in seconds"
        required: true
        type: number
        default: 14400
      auto_advance:
        description: "After a passing gate, dispatch the next existing progressive run"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: mappo-restart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_workflow:
    name: Lint GitHub Actions YAML and embedded scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify workflow with actionlint
        shell: bash
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color .github/workflows/mappo-restart-progressive.yml .github/workflows/mappo-training-windows.yml

      - name: Test MAPPO gate dispatch and restart regressions
        run: python -m unittest discover -s tools/ci/adaptive_curriculum -p "test_*.py" -v

  bootstrap:
    # A rerun must not overwrite the original bootstrap artifact.
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    name: Create a fresh curriculum cycle from a verified training checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current training contract
        uses: actions/checkout@v4

      - name: Validate source run provenance and completion
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'source_run_id must be a positive GitHub run ID' >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            | jq -e --arg repo "$GITHUB_REPOSITORY" '
                .status == "completed"
                and .conclusion == "success"
                and .repository.full_name == $repo
                and (.path | startswith(".github/workflows/mappo-training-windows.yml"))
              ' >/dev/null || { echo 'Source run must be a successful progressive training run in this repository' >&2; exit 1; }

      - name: Clear only transient workspace Blue checkpoints
        shell: bash
        run: |
          rm -rf resources/model/BluePatrol/latest resources/model/BluePatrol/prod
          rm -f resources/model/BluePatrol/adaptive-curriculum-progress.json

      - name: Restore source actor, critic, Adam and RNG
        uses: actions/download-artifact@v4
        with:
          name: blue-mappo-checkpoints
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: resources/model/BluePatrol

      - name: Verify full checkpoint and reset only curriculum progression
        env:
          GH_TOKEN: ${{ github.token }}
          START_GATE: ${{ inputs.start_gate }}
          MAX_TEAM_SIZE: ${{ inputs.max_team_size }}
          SCENARIO_VARIANT: ${{ inputs.scenario_variant }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SUCCESS_PERCENT: ${{ inputs.success_percent }}
          SAME_THRESHOLD: ${{ inputs.same_threshold_all_gates }}
          REHEARSAL_PROFILE: ${{ inputs.rehearsal_profile }}
          AUTO_ADVANCE: ${{ inputs.auto_advance }}
          RETRAIN_SELECTED_GATE: ${{ inputs.retrain_selected_gate }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from tools.ci.adaptive_curriculum.progressive_gate import (
              validate_gates, select_curriculum, validate_source_gate_fingerprint,
              validated_rehearsal_history)
          from tools.ci.adaptive_curriculum import champion_checkpoints as champion
          from tools.ci.adaptive_curriculum.rehearsal_profiles import PROFILES
          from tools.ci import mappo_curriculum

          root = Path('resources/model/BluePatrol')
          actor = root / 'latest/blue_patrol_generalized_v10.txt'
          training = root / 'latest/blue_patrol_generalized_training_v7.txt'
          progress_path = root / 'adaptive-curriculum-progress.json'
          for path in (actor, training, progress_path):
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f'Missing or empty source artifact: {path}')

          actor_header = actor.open(encoding='utf-8').readline().strip()
          training_header = training.open(encoding='utf-8').readline().strip()
          semantic = 'UNIFIED_PHYSICAL_GUIDANCE_V1'
          if (not actor_header.startswith('BLUE_TEAM_MAPPO_V10 10 10 ')
                  or semantic not in actor_header.split()
                  or not training_header.startswith('BLUE_TEAM_TRAINING_V7 7 10 ')
                  or semantic not in training_header.split()):
              raise RuntimeError('Incompatible V10 actor or full V7 optimizer semantic contract')

          gates_bytes = Path('tools/ci/adaptive_curriculum/gates.json').read_bytes()
          stages = select_curriculum(
              json.loads(gates_bytes), int(os.environ.get('MAX_TEAM_SIZE') or '2'))
          stage_names = [stage['id'] for stage in stages]
          start_gate = os.environ['START_GATE']
          rehearsal_profile = os.environ['REHEARSAL_PROFILE'] or 'legacy'
          if rehearsal_profile not in PROFILES:
              raise RuntimeError('Unknown rehearsal profile')
          if start_gate not in stage_names:
              raise RuntimeError('Unknown target gate')

          source = json.loads(progress_path.read_text(encoding='utf-8'))
          variants = {
              'fixed_no_zones': ('fixed', False),
              'fixed_zones': ('fixed', True),
              'randomized_no_zones': ('randomized', False),
              'randomized_zones': ('randomized', True),
          }
          selection = os.environ.get('SCENARIO_VARIANT') or 'fixed_no_zones'
          if selection not in variants:
              raise RuntimeError('Invalid scenario variant')
          objective_layout, hostile_zones = variants[selection]
          if (type(source.get('hostileZones', False)) is not bool
                  or source.get('hostileZones', False) is not hostile_zones
                  or source.get('objectiveLayout', 'fixed') != objective_layout):
              raise RuntimeError('Cannot restart across scenario variants')
          champion.ROOT = champion.variant_root(hostile_zones, objective_layout)
          # Check the source run's OWN immutable commit, rather than assuming
          # its gate schedule matches the new curriculum. The source may use a
          # different historical schedule (such as run 62) but must be authentic.
          source_run_id = os.environ['SOURCE_RUN_ID']
          repository = os.environ['GITHUB_REPOSITORY']
          run_metadata = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repository}/actions/runs/{source_run_id}'],
              text=True))
          source_sha = run_metadata.get('head_sha')
          if not isinstance(source_sha, str) or len(source_sha) != 40:
              raise RuntimeError('Source run has no valid commit SHA')
          source_config_payload = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repository}/contents/'
               f'tools/ci/adaptive_curriculum/gates.json?ref={source_sha}'],
              text=True))
          if source_config_payload.get('encoding') != 'base64':
              raise RuntimeError('Source gate configuration cannot be decoded')
          source_gates_bytes = base64.b64decode(source_config_payload['content'])
          if source.get('formatVersion') != 1:
              raise RuntimeError('Invalid source curriculum state')
          source_gate = source.get('gate')
          source_stages = validate_source_gate_fingerprint(
              source_gates_bytes, source.get('gateConfigSha256'), source_gate)
          updates = mappo_curriculum.read_updates(training)
          saved_updates = source.get('lastCheckpointUpdates')
          if (type(saved_updates) is not int or updates < saved_updates or updates <= 0):
              raise RuntimeError('Source optimizer checkpoint/update counter is invalid')

          # A new curriculum cycle starts from the matching evaluated FULL
          # champion pair whenever the source run provides one. Legacy artifacts
          # without such a pair remain usable as an explicit unverified warm start,
          # never represented as a certified winning checkpoint.
          # A historical source gate remains readable as a BEST pair.
          # Active training gates are defined exclusively by the new schedule.
          source_best = champion.read(source_gate)
          if source_run_id == '41865674608' and (
                  source_gate != '4v1' or source_best is None
                  or not source_best['evaluatedForGate']):
              raise RuntimeError('Run 62 requires its evaluated 4v1 BEST pair')
          if source.get('championRequired', False) and source_best is None:
              raise RuntimeError('Mandatory source champion pair is missing')
          if source_best is not None:
              updates = champion.restore_latest(source_gate)
              if start_gate != source_gate:
                  destination = champion.ROOT / start_gate
                  if destination.exists():
                      import shutil
                      history = (champion.ROOT / 'history' /
                                 os.environ['GITHUB_RUN_ID'] / start_gate)
                      history.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copytree(destination, history)
                  champion.seed(start_gate, source_gate)
              print(f'[RESTART] restored BEST V7 pair from {source_gate}'
                    f' at update={updates}')
          else:
              print('[RESTART] LEGACY source: no evaluated BEST pair in '
                    'artifact. Continuing from LATEST V7; a new evaluation '
                    'must establish the first champion.')

          threshold = float(os.environ["SUCCESS_PERCENT"])
          if not 0 < threshold <= 100:
              raise RuntimeError("success_percent must be in (0, 100]")
          same_threshold = os.environ["SAME_THRESHOLD"].lower() == "true"
          auto_advance = os.environ["AUTO_ADVANCE"].lower() == "true"

          # Preserve the historical previously validated gates for rehearsal.
          # Eight-case legacy certifications are NOT new 20-case gate proofs.
          source_validated = source.get('validatedGates', [])
          source_names = [stage['id'] for stage in source_stages]
          if (not isinstance(source_validated, list)
                  or any(type(gate_id) is not str
                         or gate_id not in source_names
                         or source_names.index(gate_id) > source_names.index(source_gate)
                         for gate_id in source_validated)
                  or (source_gate in source_validated) != source.get('passed')):
              raise RuntimeError('Inconsistent source gate validation history')
          rehearsal_history = validated_rehearsal_history(
              stages, start_gate, source_validated)

          # Keep the matched BEST weights, critic, Adam and RNG.
          # The target gate is still unvalidated.
          fresh = dict(
              formatVersion=1,
              gateConfigSha256=hashlib.sha256(gates_bytes).hexdigest(),
              gateIndex=stage_names.index(start_gate),
              gate=start_gate,
              passed=False,
              elapsedSeconds=0.0,
              bestSuccessPercent=0.0,
              lastSuccessPercent=None,
              blockIndex=0,
              lastCheckpointUpdates=updates,
              validatedGates=rehearsal_history,
              rehearsalProfile=rehearsal_profile,
              championRequired=source_best is not None,
              restartCycle=dict(
                  schemaVersion=1,
                  bootstrapRunId=int(os.environ["GITHUB_RUN_ID"]),
                  sourceRunId=int(os.environ["SOURCE_RUN_ID"]),
                  sameThresholdAllGates=same_threshold,
                  rehearsalProfile=rehearsal_profile,
                  successPercent=threshold,
                  autoAdvance=auto_advance,
                  startGate=start_gate,
                  retrainSelectedGate=os.environ["RETRAIN_SELECTED_GATE"].lower() == "true",
              ),
          )
          if int(os.environ['MAX_TEAM_SIZE']) != 2:
              fresh['maxTeamSize'] = int(os.environ['MAX_TEAM_SIZE'])
          if hostile_zones:
              fresh['hostileZones'] = True
              fresh['restartCycle']['hostileZones'] = True
          if objective_layout != 'fixed':
              fresh['objectiveLayout'] = objective_layout
              fresh['restartCycle']['objectiveLayout'] = objective_layout
          progress_path.write_text(json.dumps(fresh, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(
                  f'### New progressive Blue Defense cycle\n'
                  f'- Source run: {os.environ["SOURCE_RUN_ID"]}\n'
                  f'- Retained PPO updates: {updates}\n'
                  f'- New first gate: {start_gate}\n'
                  '- Actor, critic, Adam, and RNG: matched V7 epoch retained\n'
                  f'- Source: {"BEST evaluated pair" if source_best else "LEGACY latest warm start"}\n'
                  f'- Earlier gates eligible for rehearsal: {rehearsal_history}\n'
                  f'- Same success threshold on every gate: {same_threshold}\n'
                  f'- Training rehearsal profile: {rehearsal_profile}\n'
                  f'- Requested success threshold: {threshold:g}%\n'
                  '- No training, compilation, or production promotion in this bootstrap job\n'
              )
          print(f'[RESTART] Source run {os.environ["SOURCE_RUN_ID"]}; update={updates}; gate={start_gate}')
          PY

      - name: Publish bootstrapped checkpoint for the EXISTING training workflow
        uses: actions/upload-artifact@v4
        with:
          name: blue-mappo-checkpoints
          path: |
            resources/model/BluePatrol/latest/blue_patrol_generalized_v10.txt
            resources/model/BluePatrol/latest/blue_patrol_generalized_training_v7.txt
            resources/model/BluePatrol/prod/blue_patrol_generalized_v10.txt
            resources/model/BluePatrol/prod/blue_patrol_generalized_v10.txt.score
            resources/model/BluePatrol/best/**
            resources/model/BluePatrol/adaptive-curriculum-progress.json
          if-no-files-found: error
          retention-days: 30

  start_training:
    name: Dispatch the existing progressive training workflow (cached Release runtime)
    needs: bootstrap
    # Never re-dispatch the same first gate on a manual workflow rerun.
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch first gate of new cycle
        env:
          GH_TOKEN: ${{ github.token }}
          START_GATE: ${{ inputs.start_gate }}
          MAX_TEAM_SIZE: ${{ inputs.max_team_size }}
          SCENARIO_VARIANT: ${{ inputs.scenario_variant }}
          SUCCESS_PERCENT: ${{ inputs.success_percent }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          AUTO_ADVANCE: ${{ inputs.auto_advance }}
          SAME_THRESHOLD: ${{ inputs.same_threshold_all_gates }}
          REHEARSAL_PROFILE: ${{ inputs.rehearsal_profile }}
        shell: bash
        run: |
          REHEARSAL_PROFILE="${REHEARSAL_PROFILE:-legacy}"
          MAX_TEAM_SIZE="${MAX_TEAM_SIZE:-2}"
          SCENARIO_VARIANT="${SCENARIO_VARIANT:-fixed_no_zones}"
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo 'Restart requires a branch ref' >&2
            exit 1
          fi
          python - <<'PY'
          import math
          import os
          threshold = float(os.environ['SUCCESS_PERCENT'])
          seconds = float(os.environ['MAX_SECONDS'])
          if (not math.isfinite(threshold) or not 0 < threshold <= 100
                  or not math.isfinite(seconds) or not seconds.is_integer()
                  or not 1 <= seconds <= 18000):
              raise SystemExit('Invalid success_percent or max_seconds')
          PY
          # The restart-cycle dispatcher owns continuation in fixed mode;
          # keep its single-dispatch contract (no duplicate advance).
          TRAIN_AUTO_ADVANCE="$AUTO_ADVANCE"
          if [[ "$SAME_THRESHOLD" == "true" ]]; then
            TRAIN_AUTO_ADVANCE=false
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mappo-training-windows.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" \
            -f "inputs[resume_run_id]=${GITHUB_RUN_ID}" \
            -f "inputs[progressive_gate]=${START_GATE}" \
            -f "inputs[max_team_size]=${MAX_TEAM_SIZE}" \
            -f "inputs[scenario_variant]=${SCENARIO_VARIANT}" \
            -f "inputs[rehearsal_profile]=${REHEARSAL_PROFILE}" \
            -f "inputs[success_percent]=${SUCCESS_PERCENT}" \
            -f "inputs[same_threshold_all_gates]=${SAME_THRESHOLD}" \
            -f "inputs[max_seconds]=${MAX_SECONDS}" \
            -f 'inputs[save_every_updates]=1' \
            -f "inputs[auto_advance]=${TRAIN_AUTO_ADVANCE}"
          {
            echo '### Training dispatched'
            echo "The existing Progressive Blue Defense workflow was dispatched from bootstrap run ${GITHUB_RUN_ID}."
            echo "Gate: ${START_GATE}; threshold: ${SUCCESS_PERCENT}%; budget: ${MAX_SECONDS}s."
            echo "Training rehearsal profile: ${REHEARSAL_PROFILE}."
            echo "Same threshold for all gates: ${SAME_THRESHOLD}; automatic continuation requested: ${AUTO_ADVANCE}."
            echo 'The normal training workflow handles Release-cache validation, compile fallback, checkpoint updates, evaluation, and subsequent gate dispatch.'
            echo "[Open training runs](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/mappo-training-windows.yml)"
          } >> "$GITHUB_STEP_SUMMARY"
