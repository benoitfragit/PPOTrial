name: Resume Progressive Blue Defense (common engine)

on:
  pull_request:
    paths:
      - .github/workflows/mappo-restart-progressive.yml
      - .github/workflows/mappo-training-windows.yml
      - tools/ci/**
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful progressive run whose complete PPOKit generation must resume"
        required: true
        type: string
      progressive_gate:
        description: "Expected current stage (the persisted common state remains authoritative)"
        required: true
        type: choice
        default: "1v0"
        options:
          - 1v0
          - 2v0
          - 1v1
          - 2v1
          - 2v2
          - 3v0
          - 3v1
          - 3v2
          - 3v3
          - 4v0
          - 4v1
          - 4v2
          - 4v3
          - 4v4
      max_team_size:
        description: "Maximum team size used by the persisted curriculum plan"
        required: true
        type: choice
        default: "2"
        options:
          - "2"
          - "3"
          - "4"
      scenario_variant:
        description: "Scenario variant used by the persisted curriculum plan"
        required: true
        type: choice
        default: fixed_no_zones
        options:
          - fixed_no_zones
          - fixed_zones
          - randomized_no_zones
          - randomized_zones
      rehearsal_profile:
        description: "Rehearsal profile used by the persisted curriculum plan"
        required: true
        type: choice
        default: legacy
        options:
          - legacy
          - balanced_v1
          - patrol_focus_v1
          - combat_focus_v1
      success_percent:
        description: "Threshold used by the persisted curriculum plan"
        required: true
        type: number
        default: 92
      same_threshold_all_gates:
        description: "Use success_percent for every stage"
        required: true
        type: boolean
        default: true
      max_seconds:
        description: "Additional wall-clock budget for this resumed client run"
        required: true
        type: number
        default: 14400
      auto_advance:
        description: "Continue subsequent stages inside the common engine"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  validate_workflow:
    name: Lint common-engine workflow clients
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify workflow with actionlint
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color \
            .github/workflows/mappo-restart-progressive.yml \
            .github/workflows/mappo-training-windows.yml
      - name: Verify common plan translation
        run: python -m unittest discover -s tools/ci/adaptive_curriculum -p "test_common_plan.py" -v

  resume:
    name: Resume the persisted common curriculum generation
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Validate source generation and dispatch the common client
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PROGRESSIVE_GATE: ${{ inputs.progressive_gate }}
          MAX_TEAM_SIZE: ${{ inputs.max_team_size }}
          SCENARIO_VARIANT: ${{ inputs.scenario_variant }}
          REHEARSAL_PROFILE: ${{ inputs.rehearsal_profile }}
          SUCCESS_PERCENT: ${{ inputs.success_percent }}
          SAME_THRESHOLD: ${{ inputs.same_threshold_all_gates }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          AUTO_ADVANCE: ${{ inputs.auto_advance }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'source_run_id must be a positive GitHub run ID' >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            | jq -e --arg repo "$GITHUB_REPOSITORY" '
                .status == "completed"
                and .conclusion == "success"
                and .repository.full_name == $repo
                and (.path | startswith(".github/workflows/mappo-training-windows.yml"))
              ' >/dev/null || {
                echo 'Source must be a successful common progressive-training run' >&2
                exit 1
              }
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mappo-training-windows.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" \
            -f "inputs[resume_run_id]=${SOURCE_RUN_ID}" \
            -f "inputs[progressive_gate]=${PROGRESSIVE_GATE}" \
            -f "inputs[max_team_size]=${MAX_TEAM_SIZE}" \
            -f "inputs[scenario_variant]=${SCENARIO_VARIANT}" \
            -f "inputs[rehearsal_profile]=${REHEARSAL_PROFILE}" \
            -f "inputs[success_percent]=${SUCCESS_PERCENT}" \
            -f "inputs[same_threshold_all_gates]=${SAME_THRESHOLD}" \
            -f "inputs[max_seconds]=${MAX_SECONDS}" \
            -f 'inputs[save_every_updates]=1' \
            -f "inputs[auto_advance]=${AUTO_ADVANCE}"
          {
            echo '### Exact common-engine resume dispatched'
            echo "Source run: ${SOURCE_RUN_ID}; expected stage: ${PROGRESSIVE_GATE}."
            echo 'The PPOKit generation, environment state, curriculum state, learner and RNG are resumed together.'
          } >> "$GITHUB_STEP_SUMMARY"
