name: Build and contract tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master, refactor/generic-environment-contract, fix/restore-navigation2d-lidar-safety]
# Keep one active validation per branch/PR as draft parity corrections land.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DPPO_BUILD_DESKTOP=OFF -DPPO_BUILD_TORCH=OFF -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test without models
        run: ctest --test-dir build --output-on-failure
  desktop:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch matching Release CPU LibTorch
        shell: pwsh
        run: |
          $torchArchive = Join-Path $env:RUNNER_TEMP 'libtorch.zip'
          $torchRoot = Join-Path $env:RUNNER_TEMP 'ppo-torch'
          Invoke-WebRequest 'https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.9.1%2Bcpu.zip' -OutFile $torchArchive
          Expand-Archive $torchArchive -DestinationPath $torchRoot
          "PPO_TORCH_DIR=$torchRoot/libtorch/share/cmake/Torch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure desktop
        shell: pwsh
        run: cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 '-DTorch_DIR=${{ env.PPO_TORCH_DIR }}' -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build desktop (no launch)
        run: cmake --build build --config Release --parallel 2
      - name: Test contracts only
        run: ctest --test-dir build -C Release --output-on-failure
