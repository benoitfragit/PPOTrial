name: Core C++17 tests
on:
  push:
    branches:
      - refactor/master-generic-rl-core-20261023
  # Run generic RL core tests even for example-only changes.
  pull_request:
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DPPO_BUILD_DESKTOP=OFF -DPPO_BUILD_CORE_TESTS=ON -DPPO_BUILD_WORLD=ON
      - name: Build
        run: cmake --build build/release --config Release
      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: MAPPO telemetry Python tests
        run: python -m unittest discover -s tools/ci -p "test_mappo_metrics.py" -v
      - name: MAPPO curriculum Python tests
        run: python -m unittest discover -s tools/ci -p "test_mappo_curriculum.py" -v
      - name: Blue checkpoint Python tests
        run: python -m unittest discover -s tools/ci -p "test_blue_checkpoint.py" -v
      - name: MAPPO progressive gate Python tests
        run: python -m unittest discover -s tools/ci/adaptive_curriculum -p "test_*.py" -v
      - name: Workflow trigger tests
        run: python -m unittest discover -s tools/ci -p "test_workflow_triggers.py" -v
