name: Core C++17 tests
on:
  workflow_dispatch:
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/core -DPPO_BUILD_DESKTOP=OFF -DPPO_BUILD_CORE_TESTS=ON
      - name: Build
        run: cmake --build build/core --config Release
      - name: Test
        run: ctest --test-dir build/core -C Release --output-on-failure
      - name: MAPPO telemetry Python tests
        run: python -m unittest discover -s tools/ci -p "test_mappo_metrics.py" -v
      - name: MAPPO curriculum Python tests
        run: python -m unittest discover -s tools/ci -p "test_mappo_curriculum.py" -v
      - name: MAPPO progressive gate Python tests
        run: python -m unittest discover -s tools/ci/adaptive_curriculum -p "test_*.py" -v
      - name: Blue training diagnostic Python tests
        env:
          PYTHONPATH: tools/blue_training_diagnostics
        run: python -m unittest discover -s tools/blue_training_diagnostics/tests -p "test_*.py" -v
