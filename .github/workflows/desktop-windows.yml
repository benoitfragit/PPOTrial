name: Desktop VS2022 build

on:
  pull_request:
    branches:
      - master
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'dependencies.cmake'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            build_dir: build/debug
          - configuration: Release
            build_dir: build/release
    name: desktop (${{ matrix.configuration }})
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 (VS2022)
        run: >-
          cmake -S . -B ${{ matrix.build_dir }} -G "Visual Studio 17 2022" -A x64
          -DCMAKE_CONFIGURATION_TYPES=${{ matrix.configuration }}
          -DPPO_LIBTORCH_VARIANT=${{ matrix.configuration }}
          -DPPO_BUILD_DESKTOP=ON -DPPO_BUILD_CORE_TESTS=ON
          -DPPO_BUILD_CHECKPOINT_TESTS=ON
      - name: Build ${{ matrix.configuration }}
        run: cmake --build ${{ matrix.build_dir }} --config ${{ matrix.configuration }} --parallel 2
      - name: CTest ${{ matrix.configuration }}
        run: ctest --test-dir ${{ matrix.build_dir }} -C ${{ matrix.configuration }} --output-on-failure
      - name: Dedicated FlightControl3D root launcher
        shell: cmd
        run: Lancer_FlightControl3D_${{ matrix.configuration }}.bat --check-example
