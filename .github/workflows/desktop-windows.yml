name: Desktop VS2022 build

on:
  pull_request:
    branches:
      - master
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'dependencies.cmake'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 (VS2022)
        run: cmake -S . -B build/desktop -G "Visual Studio 17 2022" -A x64 -DPPO_BUILD_DESKTOP=ON -DPPO_BUILD_CORE_TESTS=ON
      - name: Build Debug
        run: cmake --build build/desktop --config Debug --parallel 2
      - name: CTest Debug
        run: ctest --test-dir build/desktop -C Debug --output-on-failure
      - name: Build Release
        run: cmake --build build/desktop --config Release --parallel 2
      - name: CTest Release
        run: ctest --test-dir build/desktop -C Release --output-on-failure
