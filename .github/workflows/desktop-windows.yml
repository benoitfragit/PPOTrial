name: Desktop VS2022 build

on:
  pull_request:
    branches:
      - master
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'dependencies.cmake'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    name: desktop (${{ matrix.configuration }})
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 (VS2022)
        run: >-
          cmake -S . -B build/desktop -G "Visual Studio 17 2022" -A x64
          -DCMAKE_CONFIGURATION_TYPES=${{ matrix.configuration }}
          -DPPO_LIBTORCH_VARIANT=${{ matrix.configuration }}
          -DPPO_BUILD_DESKTOP=ON -DPPO_BUILD_CORE_TESTS=ON
          -DPPO_BUILD_CHECKPOINT_TESTS=ON
      - name: Build ${{ matrix.configuration }}
        run: cmake --build build/desktop --config ${{ matrix.configuration }} --parallel 2
      - name: CTest ${{ matrix.configuration }}
        run: ctest --test-dir build/desktop -C ${{ matrix.configuration }} --output-on-failure
