name: FlightControl3D JSBSim
on:
  pull_request:
    # Every source this build compiles or runs: FlightControl3D, the shared PPOKit engine
    # (environment SDK, learners, artifacts, ppokit-run), what the root CMake adds to every
    # build (Framework, the Airspace policies) and the dependencies.
    paths:
      - 'Examples/FlightControl3D/**'
      - 'PPOKit/**'
      - 'Framework/**'
      - 'Examples/Airspace/Agents/Policy/**'
      - 'CMakeLists.txt'
      - 'dependencies.cmake'
      - 'world_dependencies.cmake'
      - 'tools/flight/**'
      - '.github/workflows/flight-control-training.yml'
      - '.github/workflows/flight-control-pc7-training.yml'
      - '.github/workflows/flight-control.yml'
  workflow_dispatch:
jobs:
  flight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        configuration: [Debug, Release]
        include:
          # The reference trace includes libm and PPO floating-point results.
          - os: ubuntu-24.04
            compiler_flags: -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13 -DPPO_FLIGHT_REQUIRE_GOLDEN_REFERENCE=ON
          - configuration: Debug
            build_dir: build/debug
          - configuration: Release
            build_dir: build/release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure native CPU example
        run: >-
          cmake -S . -B ${{ matrix.build_dir }}
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          ${{ matrix.compiler_flags }}
          -DPPO_BUILD_DESKTOP=OFF -DPPO_BUILD_CORE_TESTS=ON
          -DPPO_BUILD_FLIGHT_CONTROL=ON
      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --config ${{ matrix.configuration }} --parallel 2
      - name: Deterministic CTest including real JSBSim and RLtools
        run: ctest --test-dir ${{ matrix.build_dir }} -C ${{ matrix.configuration }} --output-on-failure
      - name: Set up Python for curriculum regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate curriculum runner behavior
        run: python -m unittest discover -s tools/flight -p 'test_curriculum*.py' -v
