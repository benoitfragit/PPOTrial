name: FlightControl3D Landing Training

on:
  # Before merge, explicitly adding the 'flight-curriculum' label starts training.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      additional_updates:
        description: "PPO updates per independent validation (repeated until pass or budget)"
        required: true
        type: number
        default: 10
      max_additional_updates:
        description: "Maximum additional PPO updates in this CI run"
        required: true
        type: number
        default: 1000
      resume_run_id:
        description: "Optional previous FlightControl3D training run ID"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: flight-control-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'flight-curriculum' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout exact training sources
        uses: actions/checkout@v4

      - name: Configure Release headless runtime
        run: >-
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
          -DPPO_BUILD_DESKTOP=OFF -DPPO_BUILD_CORE_TESTS=ON
          -DPPO_BUILD_CHECKPOINT_TESTS=OFF -DPPO_BUILD_FLIGHT_CONTROL=ON

      - name: Build FlightControl3D headless
        run: >-
          cmake --build build/release --config Release
          --target FlightControlHeadless --parallel 2

      - name: Restore previous training artifact
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: flight-control-training
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: build/flight-training

      # Restored artifacts resume; otherwise a new landing policy starts from scratch.

      - name: Train FlightControl3D until validated or bounded
        shell: bash
        env:
          ADDITIONAL_UPDATES: ${{ inputs.additional_updates || '10' }}
          MAX_ADDITIONAL_UPDATES: ${{ inputs.max_additional_updates || '1000' }}
        run: >-
          python3 tools/flight/curriculum_ci.py
          --executable build/release/Examples/FlightControl3D/FlightControlHeadless
          --config resources/settings/Scenarios/FlightControl3D_T6_Joint.json
          --output build/flight-training
          --require-release
          --updates-per-evaluation "$ADDITIONAL_UPDATES"
          --max-additional-updates "$MAX_ADDITIONAL_UPDATES"
          --runtime-seconds 16800

      - name: Publish resumable checkpoint and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-control-training
          path: |
            build/flight-training/latest/flight_policy.txt
            build/flight-training/latest/flight_policy.txt.previous
            build/flight-training/latest/curriculum_level.txt
            build/flight-training/best/**
            build/flight-training/training.csv
            build/flight-training/training_*.csv
            build/flight-training/diagnostics.csv
            build/flight-training/training_status.txt
            build/flight-training/block_*.log
          if-no-files-found: warn
          retention-days: 30
