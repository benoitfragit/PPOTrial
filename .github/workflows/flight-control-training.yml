name: FlightControl3D Curriculum Training

on:
  # Before merge, adding the 'flight-curriculum' label to PR #83 starts training.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      stage:
        description: 'Curriculum gate (progressive resumes and advances automatically)'
        required: true
        type: choice
        default: progressive
        options:
          - progressive
          - loc
          - glide
          - joint
      additional_updates:
        description: "PPO updates per gate evaluation (repeated until pass or budget)"
        required: true
        type: number
        default: 10
      max_additional_updates:
        description: "Maximum additional PPO updates in this CI run (all gates)"
        required: true
        type: number
        default: 1000
      resume_run_id:
        description: "Optional previous FlightControl3D training run ID"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: flight-control-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'flight-curriculum' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout exact training sources
        uses: actions/checkout@v4

      - name: Configure Release headless runtime
        run: >-
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
          -DPPO_BUILD_DESKTOP=OFF -DPPO_BUILD_CORE_TESTS=ON
          -DPPO_BUILD_CHECKPOINT_TESTS=OFF -DPPO_BUILD_FLIGHT_CONTROL=ON

      - name: Build headless and deterministic curriculum regressions
        run: >-
          cmake --build build/release --config Release
          --target FlightControlHeadless FlightControl_core_tests
          FlightControl_reward_tests FlightControl_simulator_tests
          FlightControl_session_tests --parallel 2

      - name: Verify reward, random starts and checkpoint validation
        run: >-
          ctest --test-dir build/release -C Release --output-on-failure
          -R '^FlightControl_(core|reward|simulator|session)_tests$'

      - name: Restore previous training artifact
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: flight-control-training
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: build/flight-training

      # A fresh clamped policy starts without the bundled tanh checkpoint.
      # An explicit resume_run_id must supply a checkpoint with actionMappingVersion=2.

      - name: Regression-test curriculum retries and resumption
        run: python3 -m unittest discover -s tools/flight -p 'test_curriculum_ci.py' -v

      - name: Train FlightControl3D until validated or bounded
        shell: bash
        env:
          REQUESTED_STAGE: ${{ inputs.stage || 'progressive' }}
          ADDITIONAL_UPDATES: ${{ inputs.additional_updates || '10' }}
          MAX_ADDITIONAL_UPDATES: ${{ inputs.max_additional_updates || '1000' }}
        run: >-
          python3 tools/flight/curriculum_ci.py
          --executable build/release/Examples/FlightControl3D/FlightControlHeadless
          --config resources/settings/Scenarios/FlightControl3D.json
          --output build/flight-training
          --stage "$REQUESTED_STAGE"
          --updates-per-evaluation "$ADDITIONAL_UPDATES"
          --max-additional-updates "$MAX_ADDITIONAL_UPDATES"
          --runtime-seconds 16800

      - name: Publish resumable checkpoint and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-control-training
          path: |
            build/flight-training/latest/flight_hybrid_v1.txt
            build/flight-training/latest/flight_hybrid_v1.txt.previous
            build/flight-training/best/**
            build/flight-training/training.csv
            build/flight-training/training_*.csv
            build/flight-training/curriculum_stage.txt
            build/flight-training/curriculum_status.txt
            build/flight-training/gate_*.log
          if-no-files-found: warn
          retention-days: 30
