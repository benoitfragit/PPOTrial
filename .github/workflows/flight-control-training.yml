name: FlightControl3D Landing Training

on:
  # Before merge, explicitly adding the 'flight-curriculum' label starts training.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      additional_updates:
        description: "PPO updates per independent validation (repeated until pass or budget)"
        required: true
        type: number
        default: 10
      max_additional_updates:
        description: "Maximum additional PPO updates in this CI run"
        required: true
        type: number
        default: 1000
      resume_run_id:
        description: "Optional previous FlightControl3D training run ID"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: flight-control-training-${{ github.ref }}-T6
  cancel-in-progress: false

jobs:
  train:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'flight-curriculum' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # The PC-7 trains in its own workflow (flight-control-pc7-training.yml).
      FLIGHT_PROJECT: T6
    steps:
      - name: Checkout exact training sources
        uses: actions/checkout@v4

      - name: Configure Release headless runtime
        run: >-
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
          -DPPO_BUILD_DESKTOP=OFF -DPPO_BUILD_CORE_TESTS=ON
          -DPPO_BUILD_CHECKPOINT_TESTS=OFF -DPPO_BUILD_FLIGHT_CONTROL=ON

      - name: Build ppokit-run and the FlightControl3D libraries
        run: >-
          cmake --build build/release --config Release
          --target ppokit-run flight_environment ppokit_graph_network flight_visualiser --parallel 2

      # The run works on a copy of the project, from the repository's checkpoint.
      - name: Prepare the project
        run: |
          mkdir -p build/flight-training
          cp -r "Examples/FlightControl3D/projects/$FLIGHT_PROJECT" "build/flight-training/$FLIGHT_PROJECT"

      # Checkpoints of an earlier workflow run replace the repository's ones.
      - name: Restore previous training artifact
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: flight-control-training-T6
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: build/flight-training/restored

      - name: Use the restored checkpoints
        if: ${{ inputs.resume_run_id != '' }}
        run: |
          rm -rf "build/flight-training/$FLIGHT_PROJECT/checkpoints"
          mv "build/flight-training/restored/$FLIGHT_PROJECT/checkpoints" "build/flight-training/$FLIGHT_PROJECT/checkpoints"

      # Every ADDITIONAL_UPDATES updates (and at the end of the budget) the validation suite
      # (eval/validation.json) plays 20 independent episodes; the run ends at the first one
      # that passes its gates and reaches its goal (full task). Exit code 3: not validated.
      - name: Train FlightControl3D until validated or bounded
        shell: bash
        env:
          ADDITIONAL_UPDATES: ${{ inputs.additional_updates || '10' }}
          MAX_ADDITIONAL_UPDATES: ${{ inputs.max_additional_updates || '1000' }}
        run: |
          set -o pipefail
          status=0
          build/release/PPOKit/ppokit-run train --project "build/flight-training/$FLIGHT_PROJECT" \
            --updates "$MAX_ADDITIONAL_UPDATES" --until-passed validation \
            --evaluate-every "$ADDITIONAL_UPDATES" --max-seconds 16800 \
            | tee build/flight-training/training.log || status=$?
          {
            echo "### FlightControl3D $FLIGHT_PROJECT training"
            grep -E "^Resuming|^evaluation 'validation'|^Suite 'validation'|^Time budget" build/flight-training/training.log || true
            if [ "$status" -eq 0 ]; then
              echo "Landing policy validated by an independent evaluation."
            else
              echo "Not validated (exit $status): resume by supplying this workflow run ID as resume_run_id."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Publish resumable checkpoint and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-control-training-T6
          path: |
            build/flight-training/T6/checkpoints/**
            build/flight-training/training.log
          if-no-files-found: warn
          retention-days: 30
